<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./style.css">
    <title>music</title>
</head>
<body>
    <header>
        <div class="header-left">
            <button class="icon-button">
                <img src="tick-icon.png" alt="Tick Icon" class="tick-icon">
            </button>
            <button class="icon-button">
                <img src="queue-icon.png" alt="Queue Icon" class="queue-icon">
            </button>
        </div>

        <div class="header-center">
            <h3>Song Name</h3>
            <p>Artist Name</p>
        </div>

        <div class="header-right">
            <button class="icon-button">
                <img src="collapse-up.PNG" alt="Collapse Up Icon" class="collapse-up-icon">
            </button>
        </div>
    </header>
    <nav class="bottom-nav">
        <a href="">Home</a>
        <a href="">Friends</a>
        <a href="">Search</a>
        <a href="">Create</a>
    </nav>

    <section class="currently-playing">

        <section class="album-art">
            <img src="album-art1.jpg" alt="Album Art">
        </section>

        <section class="progress-bar">
            <p>0:00</p>
            
            <p>3:45</p>
        </section>

        <section class="controls">
            <button class="prev">Prev</button>
            <button class="play">Play</button>
            <button class="next">Next</button>
        </section>
    </section>

    <section class="lyrics">
        <h3>Lyrics</h3>
        <p>Lyrics of the song will be displayed here.</p>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
