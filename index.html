<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>music</title>
</head>
<body>
    <nav class="bottom-nav">
        <a href="">Home</a>
        <a href="">Friends</a>
        <a href="">Search</a>
        <a href="">Create</a>
    </nav>

    <nav class="top-nav">
        <a href="">added</a>
        <a href="">queue</a>
    </nav>

    <section class="currently-playing">
        <section class="song-info">
            <h2>Song Title</h2>
            <p>Artist Name</p>
        </section>

        <section class="album-art">
            <img src="album-art1.jpg" alt="Album Art">
        </section>

        <section class="progress-bar">
            <p>0:00</p>
            
            <p>3:45</p>
        </section>

        <section class="controls">
            <button class="prev">Prev</button>
            <button class="play">Play</button>
            <button class="next">Next</button>
        </section>
    </section>

    <section class="lyrics">
        <h3>Lyrics</h3>
        <p>Lyrics of the song will be displayed here.</p>
    </section>

</body>
</html>
