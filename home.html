<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./homeStyle.css" />

    <title>Music App</title>
  </head>
  <body>
    <nav class="music-player">
      <div class="album">
        <img
          class="nirvana_cover"
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRvukvpDKmH4m5Ti0qWd6EpmMZ4YxKcxqJDXrIPecJImg&s=10"
          alt="Nirvana album cover"
        />
      </div>
      <div class="song-in">
        <p class="playing-text">Playing now</p>
        <p class="album-title">Nevermind</p>
        <p class="artist-name">Nirvana</p>
      </div>
      <i class="fa fa-play play-icon" aria-hidden="true"></i>
      <div class="profile">
        <i class="fa fa-user profile-icon" aria-hidden="true"></i>
      </div>
    </nav>

    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-6">
          <div class="form-field">
            <label for="exampleGhostInput" class="form-label"
              >Song Search</label
            >
            <div class="d-flex align-items-center gap-3 p-3 border rounded-3">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                fill="currentColor"
                aria-hidden="true"
                viewBox="0 0 16 16"
              >
                <path
                  d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"
                />
              </svg>
              <input
                type="search"
                class="form-ghost"
                id="exampleGhostInput"
                placeholder="Type the name of the song"
                aria-label="Search docs"
              />
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <nav class="music-nav container-fluid">
        <div class="row g-0">
          <div class="col nav-item">
            <a href="#" aria-label="Home">
              <i class="fa fa-home"></i>
            </a>
          </div>

          <div class="col nav-item">
            <a href="#" aria-label="Friends">
              <i class="fa fa-users"></i>
            </a>
          </div>

          <div class="col nav-item">
            <a href="#" aria-label="Search">
              <i class="fa fa-search"></i>
            </a>
          </div>

          <div class="col nav-item">
            <a href="#" aria-label="Add">
              <i class="fa fa-plus"></i>
            </a>
          </div>
        </div>
      </nav>
    </footer>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
